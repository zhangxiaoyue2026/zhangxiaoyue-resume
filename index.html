<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>张潇月 · 个人简历</title>
    <style>
        /* ===== 样式与之前完全相同，此处省略重复内容，实际使用请复制完整代码 ===== */
        /* 为保证完整性，下方为完整样式（与上次一致，仅增加后备样式） */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #e8edf5;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-cyan: #00d4ff;
            --accent-cyan-dim: rgba(0, 212, 255, 0.15);
            --accent-purple: #7c3aed;
            --accent-purple-dim: rgba(124, 58, 237, 0.15);
            --border-color: rgba(0, 212, 255, 0.15);
            --shadow-glow: 0 0 30px rgba(0, 212, 255, 0.08);
            --radius: 16px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            --nav-bg: rgba(10, 14, 23, 0.82);
            --grid-opacity: 0.04;
        }
        [data-theme="light"] {
            --bg-primary: #f0f4f8;
            --bg-secondary: #e2e8f0;
            --bg-card: rgba(255, 255, 255, 0.7);
            --bg-card-hover: rgba(255, 255, 255, 0.9);
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-color: rgba(0, 212, 255, 0.2);
            --shadow-glow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --nav-bg: rgba(240, 244, 248, 0.85);
            --grid-opacity: 0.06;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            padding-top: 72px;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: linear-gradient(rgba(0, 212, 255, var(--grid-opacity)) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, var(--grid-opacity)) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-cyan);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-purple);
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--accent-cyan), transparent);
            opacity: 0.3;
        }
        .section-title .badge-cyber {
            font-size: 0.7rem;
            font-weight: 400;
            background: var(--accent-cyan-dim);
            color: var(--accent-cyan);
            padding: 2px 12px;
            border-radius: 20px;
            letter-spacing: 0.04em;
            border: 1px solid rgba(0, 212, 255, 0.15);
        }
        .section {
            padding: 48px 0 32px;
            border-bottom: 1px solid var(--border-color);
        }
        .section:last-of-type {
            border-bottom: none;
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--nav-bg);
            backdrop-filter: blur(16px) saturate(1.4);
            -webkit-backdrop-filter: blur(16px) saturate(1.4);
            border-bottom: 1px solid var(--border-color);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background var(--transition), border-color var(--transition);
        }
        .navbar-brand {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar-brand .dot {
            color: var(--accent-cyan);
            font-size: 1.6rem;
            line-height: 1;
        }
        .navbar-links {
            display: flex;
            align-items: center;
            gap: 6px;
            list-style: none;
        }
        .navbar-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 8px;
            transition: all var(--transition);
            letter-spacing: 0.02em;
        }
        .navbar-links a:hover {
            color: var(--text-primary);
            background: var(--bg-card);
        }
        .navbar-links a.active {
            color: var(--accent-cyan);
            background: var(--accent-cyan-dim);
        }
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar-actions button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .navbar-actions button:hover {
            color: var(--text-primary);
            background: var(--bg-card);
        }
        .navbar-actions button svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 8px;
        }
        .hero {
            padding: 48px 0 32px;
            position: relative;
        }
        .hero::after {
            content: '';
            position: absolute;
            top: -80px;
            right: -80px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.06), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .hero-content h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 6px;
        }
        .hero-content h1 .highlight {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-content .motto {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            letter-spacing: 0.04em;
            font-weight: 300;
        }
        .hero-content .bio {
            font-size: 0.95rem;
            color: var(--text-secondary);
            max-width: 460px;
            margin-bottom: 20px;
            line-height: 1.7;
        }
        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .hero-tags span {
            font-size: 0.75rem;
            padding: 4px 14px;
            border-radius: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            transition: all var(--transition);
        }
        .hero-tags span:hover {
            border-color: var(--accent-cyan);
            color: var(--text-primary);
            background: var(--accent-cyan-dim);
        }
        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .hero-actions .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .hero-actions .btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }
        .hero-actions .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #fff;
            border: none;
        }
        .hero-actions .btn-primary:hover {
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.25);
            transform: translateY(-2px);
        }
        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero-avatar {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan-dim), var(--accent-purple-dim));
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 700;
            color: var(--accent-cyan);
            position: relative;
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.06);
            animation: float 6s ease-in-out infinite;
            overflow: hidden;
        }
        .hero-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }
        .hero-avatar .ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 1px solid rgba(0, 212, 255, 0.12);
            animation: spin 20s linear infinite;
            pointer-events: none;
        }
        .hero-avatar .ring:nth-child(2) {
            inset: -16px;
            border-color: rgba(124, 58, 237, 0.10);
            animation-duration: 30s;
            animation-direction: reverse;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
        }
        .highlight-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px 16px;
            text-align: center;
            transition: all var(--transition);
            backdrop-filter: blur(4px);
        }
        .highlight-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-4px);
            box-shadow: var(--shadow-glow);
            border-color: rgba(0, 212, 255, 0.25);
        }
        .highlight-card .number {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .highlight-card .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
            letter-spacing: 0.02em;
        }
        .tabs-wrapper {
            margin-top: 8px;
        }
        .tabs-nav {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .tabs-nav button {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 10px 10px 0 0;
            transition: all var(--transition);
            position: relative;
            font-family: var(--font);
            letter-spacing: 0.02em;
        }
        .tabs-nav button:hover {
            color: var(--text-primary);
            background: var(--bg-card);
        }
        .tabs-nav button[aria-selected="true"] {
            color: var(--accent-cyan);
            background: var(--accent-cyan-dim);
        }
        .tabs-nav button[aria-selected="true"]::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20%;
            right: 20%;
            height: 2px;
            background: var(--accent-cyan);
            border-radius: 2px;
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.4);
        }
        .tabs-panel {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .tabs-panel[role="tabpanel"][aria-hidden="false"] {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .edu-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px 28px;
            transition: all var(--transition);
            backdrop-filter: blur(4px);
        }
        .edu-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(0, 212, 255, 0.2);
        }
        .edu-card .head {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 6px;
        }
        .edu-card .head h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .edu-card .head .date {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 400;
        }
        .edu-card .sub {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .edu-card ul {
            list-style: none;
            padding: 0;
        }
        .edu-card ul li {
            font-size: 0.88rem;
            color: var(--text-secondary);
            padding: 3px 0 3px 20px;
            position: relative;
            line-height: 1.6;
        }
        .edu-card ul li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: var(--accent-cyan);
            opacity: 0.6;
        }
        .honor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .honor-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            transition: all var(--transition);
        }
        .honor-item:hover {
            background: var(--bg-card-hover);
            border-color: rgba(0, 212, 255, 0.2);
        }
        .honor-item .name {
            font-weight: 600;
            font-size: 0.92rem;
        }
        .honor-item .meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .honor-item .desc {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .honor-item .cert-img {
            max-height: 140px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #fff;
            padding: 4px;
            display: block;
            transition: transform 0.2s ease;
        }
        .honor-item .cert-img:hover {
            transform: scale(1.02);
        }
        /* 证书图片加载失败时显示的后备文字 */
        .honor-item .cert-fallback {
            display: none;
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
        }
        .projects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 22px 24px;
            transition: all var(--transition);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
        }
        .project-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-4px);
            box-shadow: var(--shadow-glow);
            border-color: rgba(0, 212, 255, 0.2);
        }
        .project-card .title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .project-card .date {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .project-card .tech {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }
        .project-card .tech span {
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: 12px;
            background: var(--accent-cyan-dim);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 212, 255, 0.1);
        }
        .project-card ul {
            list-style: none;
            padding: 0;
            flex: 1;
        }
        .project-card ul li {
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 3px 0 3px 18px;
            position: relative;
            line-height: 1.5;
        }
        .project-card ul li::before {
            content: '◆';
            position: absolute;
            left: 0;
            color: var(--accent-cyan);
            font-size: 0.5rem;
            top: 7px;
            opacity: 0.5;
        }
        .project-card .link {
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--accent-cyan);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all var(--transition);
            opacity: 0.7;
        }
        .project-card .link:hover {
            opacity: 1;
            gap: 10px;
        }
        .skills-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 24px;
        }
        .skill-group {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px 22px;
            transition: all var(--transition);
        }
        .skill-group:hover {
            background: var(--bg-card-hover);
            border-color: rgba(0, 212, 255, 0.15);
        }
        .skill-group .group-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 14px;
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .skill-group .group-title .icon {
            font-size: 1.1rem;
        }
        .skill-row {
            margin-bottom: 12px;
        }
        .skill-row:last-child {
            margin-bottom: 0;
        }
        .skill-row .skill-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 3px;
        }
        .skill-row .skill-bar {
            height: 4px;
            border-radius: 4px;
            background: var(--bg-secondary);
            overflow: hidden;
            position: relative;
        }
        .skill-row .skill-bar .fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            transition: width 0.8s ease;
            width: 0%;
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.15);
        }
        .footer {
            padding: 24px 0 32px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color var(--transition);
        }
        .footer a:hover {
            color: var(--accent-cyan);
        }
        .back-top {
            position: fixed;
            bottom: 32px;
            right: 32px;
            z-index: 999;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all var(--transition);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transform: translateY(12px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-top.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .back-top:hover {
            background: var(--bg-card-hover);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
        }
        @media (max-width: 900px) {
            .hero-grid {
                grid-template-columns: 1fr;
                gap: 32px;
                text-align: center;
            }
            .hero-content .bio {
                max-width: 100%;
                margin-left: auto;
                margin-right: auto;
            }
            .hero-tags {
                justify-content: center;
            }
            .hero-actions {
                justify-content: center;
            }
            .hero-avatar {
                width: 140px;
                height: 140px;
                font-size: 2.8rem;
            }
            .skills-grid {
                grid-template-columns: 1fr 1fr;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
            .honor-grid {

            ).join('');
            panels.innerHTML = tabs.map((t, i) =>
                `<div role="tabpanel" id="panel-${t.id}" aria-labelledby="tab-${t.id}" aria-hidden="${i !== 0}" class="tabs-panel">${t.content}</div>`
            ).join('');

            const buttons = nav.querySelectorAll('button');
            const panelsEl = panels.querySelectorAll('[role="tabpanel"]');
            buttons.forEach((btn, idx) => {
                btn.addEventListener('click', () => switchTab(buttons, panelsEl, idx));
                btn.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        const next = (idx + 1) % buttons.length;
                        switchTab(buttons, panelsEl, next);
                        buttons[next].focus();
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        const prev = (idx - 1 + buttons.length) % buttons.length;
                        switchTab(buttons, panelsEl, prev);
                        buttons[prev].focus();
                    }
                });
            });

            el.innerHTML = resume.projects.map(p => `
                <div class="project-card">
                    <div class="title">${p.title}</div>
                    <div class="date">${p.period}</div>
                    <div class="tech">${p.tech.map(t => `<span>${t}</span>`).join('')}</div>
                    <ul>${p.details.map(d => `<li>${d}</li>`).join('')}</ul>
                    ${p.link ? `<a class="link" href="${p.link}" target="_blank">🔗 查看项目 →</a>` : `<span class="link" style="opacity:0.4;cursor:default;">📁 作品集可提供</span>`}
                </div>
            `).join('');
        }

        function renderSkills() {
            document.getElementById('skillsGrid').innerHTML = resume.skills.map(group => `
                <div class="skill-group">
                    <div class="group-title"><span class="icon">${group.icon}</span> ${group.category}</div>
                    ${group.items.map(item => `
                        <div class="skill-row">
                            <div class="skill-label"><span>${item.name}</span><span>${Math.round(item.level)}%</span></div>
                            <div class="skill-bar"><div class="fill" style="width:${item.level}%;"></div></div>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        // ============================================================
        // INTERACTIONS
        // ============================================================

        function getPreferredTheme() {
            if (localStorage.getItem('theme')) return localStorage.getItem('theme');
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme === 'dark' ? null : 'light');
            localStorage.setItem('theme', theme);
            updateThemeIcon(theme);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
            setTheme(current === 'dark' ? 'light' : 'dark');
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            if (theme === 'light') {
                icon.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
            } else {
                icon.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><g><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></g></svg>`;
            }
        }

        function copyEmail() {
            const email = '16658538967' + '@' + '163.com';
            navigator.clipboard.writeText(email).then(() => showToast('📧 邮箱已复制：' + email))
                .catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = email;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    showToast('📧 邮箱已复制：' + email);
                });
        }

        function copyWechat() {
            const wx = resume.wechat;
            navigator.clipboard.writeText(wx).then(() => showToast('💬 微信号已复制：' + wx))
                .catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = wx;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    showToast('💬 微信号已复制：' + wx);
                });
        }

        let toastTimer = null;

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
        }

        function initBackTop() {
            const btn = document.getElementById('backTop');
            window.addEventListener('scroll', () => {
                btn.classList.toggle('visible', window.scrollY > 400);
            });
            btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        }

        function initMobileNav() {
            const toggle = document.getElementById('navToggle');
            const links = document.getElementById('navLinks');
            toggle.addEventListener('click', () => {
                const open = links.classList.toggle('open');
                toggle.setAttribute('aria-expanded', open);
                toggle.textContent = open ? '✕' : '☰';
            });
            links.querySelectorAll('a').forEach(a => {
                a.addEventListener('click', () => {
                    links.classList.remove('open');
                    toggle.setAttribute('aria-expanded', 'false');
                    toggle.textContent = '☰';
                });
            });
        }

        function initNavActive() {
            const sections = document.querySelectorAll('section[id]');
            const navLinks = document.querySelectorAll('[data-nav]');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        navLinks.forEach(link => {
                            link.classList.toggle('active', link.getAttribute('href') === '#' + id);
                        });
                    }
                });
            }, { threshold: 0.3, rootMargin: '-60px 0px -60px 0px' });
            sections.forEach(s => observer.observe(s));
        }

        // ============================================================
        // INIT
        // ============================================================

        document.addEventListener('DOMContentLoaded', () => {
            setTheme(getPreferredTheme());
            renderHeroTags();
            renderHeroActions();
            renderHighlights();
            renderExperience();
            renderProjects();
            renderSkills();
            initBackTop();
            initMobileNav();
            initNavActive();
        });
    </script>
</body>
</html>
